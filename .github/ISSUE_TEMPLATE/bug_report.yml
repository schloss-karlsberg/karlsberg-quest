name: Bug report
description: Something in the game is broken, stuck or wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or German are both fine.
        Tip: press **F8** in the game at the moment the problem happens. It writes a note with your
        position and the last 30 seconds of events. Export it from the pause menu (Esc →
        „Notizen exportieren“) and paste or attach it below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New game, prologue
        2. Talk to …
        3. …
    validations:
      required: false
  - type: input
    id: where
    attributes:
      label: Where in the game?
      description: Chapter, quest, era and place, if you know them.
      placeholder: "Kapitel 1, „Wasser, das sich erinnert“, 1789, Ehrenhof"
  - type: input
    id: url
    attributes:
      label: URL and flags
      description: The full address you played on, including any flags such as ?q=low, ?kapitel=2 or ?debug.
      placeholder: "https://schloss-karlsberg.github.io/karlsberg-quest/?q=med"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 140 on Windows 11"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Graphics card or chip (Chrome shows it under chrome://gpu → "GL_RENDERER").
      placeholder: "NVIDIA RTX 3060 / Apple M2 / Intel Iris Xe"
    validations:
      required: true
  - type: dropdown
    id: quality
    attributes:
      label: Quality tier
      options:
        - Automatic
        - low
        - med
        - high
        - Don't know
  - type: textarea
    id: f8
    attributes:
      label: F8 note
      description: Paste the text of the exported F8 note (or attach the file).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors, anything else
      description: Errors from the browser console (F12) help a lot.
