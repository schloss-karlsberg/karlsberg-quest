# Hosted Playwright runs (CONTRIBUTING.md "What runs on a pull request").
#
# Pull request: the specs its changed paths can affect, plus smoke (scripts/ci/e2e-areas.ts). Shared
#   code runs the full suite; docs, task files and unit tests run nothing. The `full-e2e` label
#   forces the full suite.
# Merge queue, push to main, manual run without `specs`: the full suite.
#
# The job "End-to-end tests" always reports, also when no spec had to run and as a failure when the
# run was cancelled, so it is the one check the merge bar (or a ruleset) needs to name.
name: End-to-end tests

# Manual runs say what they ran. A push to main skips its run when a full manual run or the merge
# queue already passed on the same commit, and finds the full manual run by this name.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && (inputs.specs == '' && 'End-to-end tests (full suite, manual)' || format('End-to-end tests ({0})', inputs.specs))
  || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specs:
        description: Space-separated spec names (for example chapter-k2 smoke). Leave blank for the full suite.
        required: false
        type: string

permissions:
  contents: read
  actions: read # find an earlier full run of a pushed commit
  pull-requests: read # read the full-e2e label

# Runs on main share one group and are never cancelled: GitHub keeps one running and one waiting,
# so the waiting run covers every merge that arrived in between. Every other run has a group of
# its own at this level.
#
# A new push to a pull request replaces the old run job by job instead (the `concurrency` of the
# jobs "plan" and "e2e"). The job "End-to-end tests" is in no group: it has to run after a
# cancellation to report a failure, and a run that still has a job to run would keep a
# workflow-level group, so the run of the new commit would wait for a runner twice.
concurrency:
  group: e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select specs and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: e2e-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}-plan
      cancel-in-progress: true
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      reason: ${{ steps.select.outputs.reason }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge into the base; the first parent is the base.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: List the changed paths
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            # --no-renames lists both names of a moved file.
            git -c core.quotePath=false diff --no-renames --name-only 'HEAD^1' HEAD > "$RUNNER_TEMP/changed.txt"
            echo "KQ_E2E_CHANGED_FILE=$RUNNER_TEMP/changed.txt" >> "$GITHUB_ENV"
            # The selection below runs from this checkout, so a pull request that edits it would be
            # judged by its own rules. Decide that case here, in the workflow, without the script.
            if grep -q -E '^(scripts/ci/|scripts/dev/plan-e2e-shards\.ts$|\.github/workflows/)' "$RUNNER_TEMP/changed.txt"; then
              echo "KQ_E2E_GUARD=the pull request changes the e2e selection or a workflow" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::The checkout is not a merge commit, so the changed paths are unknown. Running the full suite."
          fi
      - name: Read the pull request labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PAYLOAD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Ask the API, so that "Re-run all jobs" sees a label added after the run started.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name] | join(",")') || labels="$PAYLOAD_LABELS"
          echo "KQ_E2E_LABELS=${labels//$'\n'/ }" >> "$GITHUB_ENV"
      - name: Look for a full run of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merge queue and a manual full run test the exact commit that main then points at.
          # Both always run the full suite; keep this filter in step with scripts/ci/select-e2e.ts.
          filter='[.workflow_runs[] | select(.event == "merge_group" or (.event == "workflow_dispatch" and (.display_title | startswith("End-to-end tests (full suite"))))][0].html_url // empty'
          url=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" --jq "$filter") || url=
          echo "KQ_E2E_VERIFIED_BY=$url" >> "$GITHUB_ENV"
      - name: Select the specs
        id: select
        env:
          KQ_E2E_SPECS: ${{ inputs.specs }}
          # A fork can change the rules it is tested with, so it always gets the full suite.
          KQ_E2E_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Unset: shared code runs the full suite on the pull request. `quick`: a cross-section,
          # for when the full suite passes before every merge anyway (CONTRIBUTING.md).
          KQ_E2E_SHARED_CODE: ${{ vars.E2E_SHARED_CODE }}
        run: |
          if [[ -n "$KQ_E2E_GUARD" ]]; then
            { echo "mode=full"; echo "specs="; echo "reason=$KQ_E2E_GUARD"; } >> "$GITHUB_OUTPUT"
            printf '### Full end-to-end suite\n\n%s\n\n' "$KQ_E2E_GUARD" >> "$GITHUB_STEP_SUMMARY"
            echo "full: $KQ_E2E_GUARD"
            exit 0
          fi
          node scripts/ci/select-e2e.ts
      # Also when no spec runs: setup-node's cache step fails after the job if the store is missing.
      - run: pnpm install --frozen-lockfile
      - name: Plan file-level shards
        id: shards
        env:
          MODE: ${{ steps.select.outputs.mode }}
          KQ_E2E_SPECS: ${{ steps.select.outputs.specs }}
          # The account runs 20 hosted jobs at once. The post-merge run on main takes fewer
          # runners than a run someone is waiting for.
          KQ_E2E_MAX_SHARDS: ${{ github.event_name == 'push' && '8' || '12' }}
          # A selected run gets as many runners as it has work for.
          KQ_E2E_SHARD_MINUTES: ${{ steps.select.outputs.mode == 'selected' && '8' || '' }}
        run: |
          if [[ "$MODE" == none ]]; then
            echo 'matrix={"include":[{"shard":0,"specs":"","campaign":false,"minutes":0}]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/e2e-discovery.json"
          pnpm exec playwright test --list --reporter=json
          node scripts/dev/plan-e2e-shards.ts < "$PLAYWRIGHT_JSON_OUTPUT_FILE" > "$RUNNER_TEMP/matrix.txt"
          if [[ "$MODE" == full ]]; then
            # Checked here and not in the planner: the full suite is every spec file.
            planned=$(sed -n 's/^matrix=//p' "$RUNNER_TEMP/matrix.txt" | jq -r '.include[].specs' | grep -c '\.spec\.ts$' || true)
            present=$(find e2e -maxdepth 1 -name '*.spec.ts' | wc -l)
            if [[ "$planned" -ne "$present" ]]; then
              echo "::error::The full suite must run every spec file: $planned of $present are planned."
              exit 1
            fi
          fi
          cat "$RUNNER_TEMP/matrix.txt" >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.mode != 'none'
        run: pnpm build
      - if: steps.select.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: dist/
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  e2e:
    name: Playwright shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    # Playwright has 180 minutes, or 240 for the campaign. Reserve time for setup and upload.
    timeout-minutes: ${{ matrix.campaign && 270 || 205 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The shard of a new push cancels the shard with the same number of the old run.
    concurrency:
      group: e2e-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}-shard-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # The group above only acts once the new run has planned a shard with this number. Until
      # then, and for shards the new run does not have, a shard stops itself: here before it does
      # any work, and once a minute while Playwright runs. It always stops as a failure.
      - name: Stop if a newer push replaced this commit
        if: github.event_name == 'pull_request'
        run: |
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/pull/$PR/head" 2> /dev/null | cut -f1) || head=
          if [[ -n "$head" && "$head" != "$PR_HEAD" ]]; then
            echo "::error::A newer push ($head) replaced this commit. This shard does not run."
            echo "KQ_SUPERSEDED=1" >> "$GITHUB_ENV"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: dist/
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the voice spec's encoder
        if: contains(matrix.specs, 'voice.spec.ts')
        run: |
          if [[ ! -x /usr/bin/ffmpeg ]]; then
            sudo apt-get install -y ffmpeg
          fi
      - name: Run Playwright
        env:
          SPEC_FILES: ${{ matrix.specs }}
          KQ_E2E_CAMPAIGN: ${{ matrix.campaign && '1' || '0' }}
          # No retry after a merge: a flaky test turns main red and opens the issue.
          KQ_E2E_RETRIES: ${{ github.event_name == 'push' && '0' || '1' }}
        run: |
          printf '%s\n' "$SPEC_FILES" > "$RUNNER_TEMP/e2e-specs.txt"
          # Resource trace: hosted runners have been lost mid-run ("shutdown signal"); log memory and
          # the biggest processes every 20 s so the cause shows up in the job log.
          ( tick=0
            while true; do
              echo "::group::resources $(date -u +%H:%M:%S)"
              free -m | sed -n '1,3p'; uptime
              ps -eo rss=,nlwp=,comm= --sort=-rss | head -5 | awk '{printf "%7.0f MB %5d thr %s\n", $1/1024, $2, $3}'
              echo "::endgroup::"
              # Once a minute: a newer push makes this commit obsolete. Ending this step with a
              # signal fails the shard; the runner clears the browser away with the job.
              if [[ -n "$PR" && $((tick % 3)) -eq 2 ]]; then
                head=$(git ls-remote origin "refs/pull/$PR/head" 2> /dev/null | cut -f1) || head=
                if [[ -n "$head" && "$head" != "$PR_HEAD" ]]; then
                  echo "::error::A newer push ($head) replaced this commit. Stopping this shard."
                  echo "KQ_SUPERSEDED=1" >> "$GITHUB_ENV"
                  kill -TERM $$
                  exit 0
                fi
              fi
              tick=$((tick + 1))
              sleep 20
            done ) &
          pnpm exec playwright test --test-list "$RUNNER_TEMP/e2e-specs.txt" --workers=1
      - name: Record the spec timings
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ -f test-results/e2e-report.json ]]; then
            node scripts/ci/e2e-timings.ts test-results/e2e-report.json "$RUNNER_TEMP/timings-$SHARD.tsv"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timings-${{ matrix.shard }}.tsv
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() && env.KQ_SUPERSEDED != '1'
        with:
          name: e2e-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  result:
    # The merge signal. A manual run of chosen specs gets another name, so that it cannot stand in
    # for the pull request's own check on the same commit.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.specs != '' && 'End-to-end tests (manual selection)' || 'End-to-end tests' }}
    needs: [plan, e2e]
    # always(): with any other condition this job is skipped when the run is cancelled or a shard
    # fails, and GitHub counts a skipped check as passing. It reports a failure for a cancelled
    # run, a cancelled or timed-out shard and a shard that stopped itself. It is in no concurrency
    # group, so it never makes the run of a newer commit wait.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        with:
          pattern: e2e-timings-*
          path: timings
          merge-multiple: true
      - name: Report
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
          E2E: ${{ needs.e2e.result }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR" ]]; then
            head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/pull/$PR/head" 2> /dev/null | cut -f1) || head=
            if [[ -n "$head" && "$head" != "$PR_HEAD" ]]; then
              echo "::notice::A newer push ($head) replaced this commit. Only the result on the newest commit counts."
            fi
          fi
          {
            echo "### End-to-end tests: ${MODE:-not planned}"
            echo
            echo "$REASON"
            echo
            if compgen -G 'timings/*.tsv' > /dev/null; then
              echo "#### Spec timings"
              echo
              echo "Minutes on this run's hosted runners, retries included. Source for scripts/ci/e2e-minutes.ts."
              echo
              echo "| Spec | Minutes | Tests | Failed | Flaky | Slowest test | Its minutes |"
              echo "| --- | ---: | ---: | ---: | ---: | --- | ---: |"
              cat timings/*.tsv | sort -t "$(printf '\t')" -k2,2nr \
                | awk -F '\t' '{ printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7 }'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A test that passed only on its retry must not go unnoticed behind a green check.
          flaky=
          if compgen -G 'timings/*.tsv' > /dev/null; then
            flaky=$(cat timings/*.tsv | awk -F '\t' '$5 > 0 { printf "%s%s: %s", sep, $1, $8; sep = " | " }')
          fi
          if [[ -n "$flaky" ]]; then
            echo "::warning title=Flaky e2e tests::Passed only on the retry: $flaky. Fix them or file a task."
            {
              echo "#### Flaky tests (passed only on the retry)"
              echo
              cat timings/*.tsv | awk -F '\t' '$5 > 0 { printf "- **%s**: %s\n", $1, $8 }'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$PLAN" != success ]]; then
            echo "::error::Selecting the specs or building the game did not succeed ($PLAN)."
            exit 1
          fi
          if [[ "$MODE" == none && "$E2E" == skipped ]]; then
            echo "No end-to-end tests needed: $REASON"
            exit 0
          fi
          if [[ "$MODE" != none && "$E2E" == success ]]; then
            echo "End-to-end tests passed ($MODE): $REASON"
            exit 0
          fi
          echo "::error::End-to-end tests did not pass (mode ${MODE:-unknown}, shards: $E2E)."
          exit 1

  main-alert:
    # A red main is announced in one issue, which closes itself when main is green again.
    name: Report the state of main
    needs: [plan, result]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.result.result }}
          COMPARE: ${{ github.event.compare }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="End-to-end tests are red on main"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Green again at $GITHUB_SHA: $RUN_URL"
            fi
            exit 0
          fi
          # A cancelled run says nothing about main.
          if [[ "$RESULT" != failure ]]; then exit 0; fi
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("Playwright"))) | "- [\(.name)](\(.html_url))"') || failed=
          body=$(printf '%s\n' \
            "The full suite failed on \`main\` at $GITHUB_SHA." \
            "" \
            "- Run: $RUN_URL" \
            "- Commits since the previous push: $COMPARE" \
            "" \
            "${failed:-No failed shard was found; open the run.}" \
            "" \
            "The live game is deployed from \`main\`. Fix forward or revert the merge that caused it" \
            "(CONTRIBUTING.md, \"When main is red\"). \`gh run rerun ${GITHUB_RUN_ID} --failed\` repeats only the failed shards.")
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
